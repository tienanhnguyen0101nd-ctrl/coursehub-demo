name: CourseHub CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    # database.py doc DB_* ngay khi import. Gia tri gia chi de import app;
    # contract test khong mo ket noi PostgreSQL.
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: coursehub
      DB_USER: ci_user
      DB_PASSWORD: ci_not_a_secret
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Compile backend
        run: python -m compileall backend
      - name: Test backend contract
        run: pytest backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Test frontend
        run: npm test
      - name: Build frontend
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v6
      - name: Prepare non-secret Docker env for build validation
        run: cp backend/.env.docker.example backend/.env.docker
      - name: Validate Compose
        run: docker compose config
      - name: Build images
        run: docker compose build
      # Bai 4: buoc tren da tao backend/.env.docker. Neu .dockerignore bi sua sai,
      # file env se bi COPY vao image -> buoc nay do.
      - name: Check backend image has no env/secret file
        run: |
          docker compose run --rm --no-deps backend sh -c '
            for f in /app/backend/.env /app/backend/.env.docker; do
              if [ -f "$f" ]; then echo "SECRET FILE IN IMAGE: $f"; exit 1; fi
            done
            echo "OK: no .env files in backend image"'
